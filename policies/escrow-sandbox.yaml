# Escrow sandbox policy: the only network exit is inference.
#
# inference.local is OpenShell's managed inference route. The host-side OpenShell gateway
# forwards it to the Escrow spend proxy (127.0.0.1:8000), which forwards only to
# api.tokenfactory.nebius.com. Every other host, including Token Factory itself, is denied.
#
# Filesystem, landlock, and process sections are unchanged from the NemoClaw-generated base policy.
version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /var/lib/dpkg
  read_write:
    - /tmp
    - /dev/null
    - /dev/pts
    - /sandbox/.openclaw
    - /sandbox/.nemoclaw
    - /home/linuxbrew

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  managed_inference:
    name: managed_inference
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        rules:
          - allow: { method: GET, path: "/v1/models" }
          - allow: { method: POST, path: "/v1/chat/completions" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }
      - { path: /usr/bin/node }
      - { path: /usr/bin/curl }
      - { path: /usr/bin/python3 }
